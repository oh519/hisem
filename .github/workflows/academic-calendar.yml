name: Update official academic calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academic-calendar.yml'
      - 'scripts/fetch_academic_calendar.py'
      - 'tests/test_academic_calendar.py'
  schedule:
    - cron: '37 7 1 * *'
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: academic-calendar-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser
        run: python -m unittest discover -s tests -p 'test_academic_calendar.py'
      - name: Fetch official public schedule
        run: python scripts/fetch_academic_calendar.py
      - name: Save snapshot on main and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/academic-calendar.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/academic-calendar.json
          git commit -m 'Update official academic calendar snapshot'
          git push origin HEAD:refs/heads/main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
