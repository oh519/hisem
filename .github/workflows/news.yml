name: Update news

on:
  schedule:
    - cron: "17 23 * * *"   # every day 08:17 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest headlines
        run: python3 scripts/fetch_news.py

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news"
          git push
          # pushes made with the workflow token may not start a Pages build on their own
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
